apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: curl-to-httpbin
spec:
  targetRefs:
    - kind: Gateway
      group: gateway.networking.k8s.io
      name: waypoint
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/default/sa/curl
      to:
        - operation:
            methods: ["POST"]
