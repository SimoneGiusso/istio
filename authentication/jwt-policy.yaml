apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: require-jwt
  namespace: foo
spec:
  selector:
    matchLabels:
      app: httpbin
  action: ALLOW
  rules:
    - from:
        - source:
            requestPrincipals: [
                "testing@secure.istio.io/testing@secure.istio.io",
              ] # Istio constructs the requestPrincipal by combining the iss and sub of the JWT token with a / separator
